<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. — Device Controller</title>
    <style>
        /* Add your HUD styling here */
        body { background: #020711; color: #00d9ff; font-family: monospace; padding: 20px; }
        input, button { padding: 10px; background: #031522; color: #fff; border: 1px solid #00d9ff; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S. Command Center</h1>
    <input id="commandInput" type="text" placeholder="Type command (e.g., open settings)..." style="width: 70%;">
    <button id="execBtn">Execute</button>
    <div id="output" style="margin-top: 20px;"></div>

    <!-- ALL JAVASCRIPT LIVES HERE INSIDE SCRIPT TAGS -->
    <script>
        document.getElementById('execBtn').addEventListener('click', () => {
            const input = document.getElementById('commandInput').value.trim();
            const outputDiv = document.getElementById('output');
            
            let result = handleDeviceCommand(input);
            outputDiv.innerHTML = `> ${result}`;
        });

        function handleDeviceCommand(text) {
            const cmd = text.toLowerCase();
            
            // Android Intent for Settings
            if (cmd.includes("open settings") || cmd.includes("control panel")) {
                window.location.href = "intent:#Intent;action=android.settings.SETTINGS;end;";
                return "Launching Android system settings.";
            }
            
            // Android Intent for Phone Dialer
            if (cmd.includes("open dialer") || cmd.includes("make a call")) {
                window.location.href = "intent://#Intent;scheme=tel;end;";
                return "Opening phone dialer.";
            }
            
            // Open YouTube
            if (cmd.includes("open youtube")) {
                window.open("https://www.youtube.com", "_blank");
                return "Launching YouTube.";
            }

            return "Command not recognized as a direct device action.";
        }
    </script>
</body>
</html>

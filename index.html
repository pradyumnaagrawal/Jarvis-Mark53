<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MARK-64 V3 - Mark-LIII Replica</title>
<style>
:root{--cyan:#00f2ff;--bg:#050a0e;--panel:rgba(10,20,30,0.85)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono',monospace}
body{background:radial-gradient(ellipse at center,#0a1a25 0%,#050a0e 100%);color:var(--cyan);height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reactor{width:280px;height:280px;border-radius:50%;border:2px solid var(--cyan);position:relative;box-shadow:0 0 40px var(--cyan),inset 0 0 40px rgba(0,242,255,0.2);animation:pulse 2s infinite}
.reactor::before{content:'';position:absolute;top:50%;left:50%;width:60%;height:60%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--cyan);box-shadow:0 0 20px var(--cyan)}
.core{position:absolute;top:50%;left:50%;width:30%;height:30%;transform:translate(-50%,-50%);background:var(--cyan);border-radius:50%;box-shadow:0 0 30px var(--cyan);animation:core 1.5s infinite alternate}
@keyframes pulse{0%{box-shadow:0 0 20px var(--cyan)}50%{box-shadow:0 0 60px var(--cyan)}100%{box-shadow:0 0 20px var(--cyan)}}
@keyframes core{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1.2)}}
.waveform{margin-top:40px;width:90%;max-width:400px;height:60px;display:flex;align-items:center;justify-content:center;gap:3px}
.bar{width:4px;height:10px;background:var(--cyan);border-radius:2px;transition:height 0.1s}
.status{margin-top:20px;font-size:12px;letter-spacing:2px;opacity:0.8}
.btn{margin-top:30px;padding:12px 30px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);letter-spacing:3px;cursor:pointer;box-shadow:0 0 10px var(--cyan)}
.btn:hover{background:rgba(0,242,255,0.1)}
.comms{position:fixed;bottom:20px;width:90%;max-width:400px;background:var(--panel);border:1px solid var(--cyan);padding:15px;backdrop-filter:blur(10px)}
.input-row{display:flex;gap:10px;margin-top:10px}
input{flex:1;background:rgba(0,0,0,0.5);border:1px solid var(--cyan);color:var(--cyan);padding:8px}
.action{padding:8px 12px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);cursor:pointer}
</style>
</head>
<body>
<div class="reactor"><div class="core"></div></div>
<div class="waveform" id="waveform"></div>
<div class="status" id="statusText">● MARK-64 V3 • STANDBY • SAY "MESSAGE ANYONE"</div>
<button class="btn" onclick="JARVIS.startListening()">◉ ACTIVATE JARVIS</button>

<div class="comms">
<div id="contactsList" style="font-size:10px;max-height:60px;overflow:auto"></div>
<div class="input-row">
<input id="contactNameInput" placeholder="name or number">
<input id="messageTextInput" placeholder="message">
<button class="action" onclick="JARVIS.sendMessage('whatsapp')">WA</button>
<button class="action" onclick="JARVIS.sendMessage('call')">CALL</button>
<button class="action" onclick="autoReadMobileContacts()">📲 AUTO READ</button>
</div>
</div><script>
// SECURE - Asks API key on start, stores locally, never in code
let GEMINI_API_KEY = localStorage.getItem('jarvis-gemini-key') || "";

let JARVIS={
 contacts:JSON.parse(localStorage.getItem('jarvis-contacts-v2')||'{"mummy":"919876543210"}'),

 askApiKey(){
   if(GEMINI_API_KEY) return true;
   let key = prompt("🔑 Enter your Gemini API Key (free from aistudio.google.com):\n\nIt will be saved only on your phone - not in code");
   if(key && key.length>20){
     GEMINI_API_KEY = key.trim();
     localStorage.setItem('jarvis-gemini-key', GEMINI_API_KEY);
     document.getElementById('statusText').innerText='● API Key Saved - Secure - Local Only';
     return true;
   } else {
     document.getElementById('statusText').innerText='● No API Key - Voice commands still work';
     return false;
   }
 },

 showContacts(){
   let html=Object.entries(this.contacts).map(([k,v])=>`<span style="margin-right:10px">${k}:${v.slice(-4)}</span>`).join('');
   document.getElementById('contactsList').innerHTML=html||'No contacts - Click AUTO READ';
 },

 async startListening(){
   // ASK API KEY ON FIRST START
   if(!GEMINI_API_KEY){
     this.askApiKey();
   }

   const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!Speech){alert('Use Chrome/Web2App');return;}
   let rec=new Speech(); rec.lang='en-IN'; rec.continuous=false;
   rec.onstart=()=>{document.getElementById('statusText').innerText='● LISTENING...'; pulseWaveform(true);}
   rec.onresult=(e)=>{let txt=e.results[0][0].transcript; handleCommand(txt); pulseWaveform(false);}
   rec.start();
   try{
     let stream=await navigator.mediaDevices.getUserMedia({audio:true});
     let ctx=new AudioContext(); let analyser=ctx.createAnalyser();
     let src=ctx.createMediaStreamSource(stream); src.connect(analyser);
     let data=new Uint8Array(analyser.frequencyBinCount);
     setInterval(()=>{analyser.getByteFrequencyData(data); let avg=data.reduce((a,b)=>a+b)/data.length; updateBars(avg);},80);
   }catch{}
 },

 sendMessage(type){
  let name=document.getElementById('contactNameInput').value.trim().toLowerCase();
  let msg=document.getElementById('messageTextInput').value||'hii';
  let rawNum=name.replace(/\D/g,''); let num=this.contacts[name];
  if(rawNum.length>=10 &&!num){num=rawNum.length==10?'91'+rawNum:rawNum; this.contacts[name]=num; localStorage.setItem('jarvis-contacts-v2',JSON.stringify(this.contacts));}
  if(!num){let n=prompt(`Number for ${name}:`); if(!n)return; n=n.replace(/\D/g,''); if(n.length==10)n='91'+n; this.contacts[name]=n; localStorage.setItem('jarvis-contacts-v2',JSON.stringify(this.contacts)); num=n; this.showContacts();}
  if(type=='whatsapp'){window.location.href=`https://wa.me/${num}?text=${encodeURIComponent(msg)}`;}
  else if(type=='call'){window.location.href=`tel:${num}`;}
  else{window.location.href=`sms:${num}?body=${encodeURIComponent(msg)}`;}
 },

 openApp(app){
   let map={youtube:'vnd.youtube://',spotify:'spotify://',instagram:'intent://#Intent;package=com.instagram.android;end'};
   window.location.href=map[app]||`intent://#Intent;package=com.${app}.android;end`;
 },

 changeApiKey(){
   localStorage.removeItem('jarvis-gemini-key');
   GEMINI_API_KEY="";
   this.askApiKey();
 }
};

function updateBars(v){document.querySelectorAll('.bar').forEach(b=>b.style.height=(5+v/8+Math.random()*20)+'px');}
function pulseWaveform(active){if(!active){document.querySelectorAll('.bar').forEach(b=>b.style.height='10px');}}
function createBars(){let w=document.getElementById('waveform'); for(let i=0;i<32;i++){let b=document.createElement('div'); b.className='bar'; w.appendChild(b);}}
createBars(); JARVIS.showContacts();

// AUTO READ MOBILE CONTACTS - Web2App Pro + AppMint
async function autoReadMobileContacts(){
 document.getElementById('statusText').innerText='● Reading mobile contacts...';
 try{
  if(navigator.contacts && navigator.contacts.select){
    let contacts=await navigator.contacts.select(['name','tel'],{multiple:true});
    contacts.forEach(c=>{
      if(!c.tel[0])return; let tel=c.tel[0].replace(/\D/g,''); if(tel.length==10)tel='91'+tel;
      let key=c.name[0].toLowerCase().split(' ')[0]; JARVIS.contacts[key]=tel;
      JARVIS.contacts[c.name[0].toLowerCase()]=tel;
    });
    localStorage.setItem('jarvis-contacts-v2',JSON.stringify(JARVIS.contacts));
    JARVIS.showContacts();
    document.getElementById('statusText').innerText=`● Loaded ${contacts.length} contacts - ANYONE ready`;
    return;
  }
 }catch(e){console.log(e);}
 document.getElementById('statusText').innerText='● Click AUTO READ and allow Contacts';
}<script>
async function askAI(q){
 if(!GEMINI_API_KEY){
   let ok = JARVIS.askApiKey();
   if(!ok ||!GEMINI_API_KEY){document.getElementById('statusText').innerText='● Need API key for AI - Voice commands still work without it'; return;}
 }
 document.getElementById('statusText').innerText='● THINKING...';
 try{
   let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,{
     method:'POST', headers:{'Content-Type':'application/json'},
     body:JSON.stringify({contents:[{parts:[{text:q}]}]})
   });
   let data=await res.json();
   if(data.error){ if(data.error.message.includes('API_KEY')){localStorage.removeItem('jarvis-gemini-key'); GEMINI_API_KEY=""; document.getElementById('statusText').innerText='● Wrong API Key - Click ACTIVATE again'; return;} throw new Error(data.error.message);}
   let ans=data.candidates[0].content.parts[0].text;
   document.getElementById('statusText').innerText='● '+ans.slice(0,80);
   speechSynthesis.speak(new SpeechSynthesisUtterance(ans));
 }catch(e){document.getElementById('statusText').innerText='● Error: '+e.message.slice(0,50); console.log(e);}
}
function handleCommand(raw){
 if(!raw)return;
 let cmd=raw.toLowerCase().trim();
 document.getElementById('statusText').innerText='● Heard: '+raw;
 if(cmd.startsWith('message')||cmd.startsWith('msg')||cmd.includes('whatsapp')){
   let cl=cmd.replace(/^message\s*/,'').replace(/^msg\s*/,'').replace(/on whatsapp/,'').trim();
   let parts=cl.split(' '); let name=parts[0]; let msg=parts.slice(1).join(' ')||'hii';
   document.getElementById('contactNameInput').value=name; document.getElementById('messageTextInput').value=msg;
   JARVIS.sendMessage('whatsapp'); return;
 }
 if(cmd.includes('call')){
   let name=cmd.replace('call','').trim().split(' ')[0]; document.getElementById('contactNameInput').value=name; JARVIS.sendMessage('call'); return;
 }
 if(cmd.startsWith('open')||cmd.startsWith('play')){let app=cmd.replace(/open|play/,'').trim().split(' ')[0]; JARVIS.openApp(app); return;}
 if(cmd.includes('change api')||cmd.includes('api key')){JARVIS.changeApiKey(); return;}
 askAI(raw);
}

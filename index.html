<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis-Mark53</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#00e5ff;font-family:'Share Tech Mono',monospace;overflow:hidden}
#canvas{position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;z-index:1!important}
#ui{position:fixed;top:10px;left:10px;z-index:100;background:linear-gradient(180deg,rgba(0,20,40,0.98),rgba(0,10,20,0.98));padding:14px;border:1px solid #00e5ff;border-radius:12px;width:400px;max-height:96vh;overflow-y:auto;box-shadow:0 0 30px rgba(0,229,255,0.35)}
#gesture{position:fixed;top:10px;right:10px;z-index:100;background:rgba(0,20,40,0.97);padding:12px;border:1px solid #00ff88;border-radius:12px;width:300px}
.holo-btn{margin:3px;padding:6px 9px;border:1px solid #00e5ff;background:rgba(0,229,255,0.12);color:#00e5ff;border-radius:6px;font-size:9px;cursor:pointer;display:inline-block}
#video{position:fixed;bottom:10px;right:10px;width:180px;height:135px;border:2px solid #00ff88;border-radius:12px;transform:scaleX(-1);z-index:100;background:#000}
input,button{padding:10px;border-radius:6px;border:1px solid #00e5ff;background:rgba(0,25,50,0.8);color:#00e5ff;width:100%;margin-top:6px;font-family:'Share Tech Mono'}
button{cursor:pointer;font-weight:bold}
.app-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.app-btn{background:rgba(0,255,136,0.12)!important;border-color:#00ff88!important;font-size:10px!important}
#jarvisHud{width:90px;height:90px;margin:0 auto 10px;position:relative;border:2px solid #00e5ff;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,0.2),#000);box-shadow:0 0 20px #00e5ff;display:flex;align-items:center;justify-content:center;animation:reactor 2.5s infinite}
#jarvisHud::before{content:'';position:absolute;width:70%;height:70%;border:1px dashed rgba(0,229,255,0.5);border-radius:50%;animation:spin 8s linear infinite}
#jarvisHud::after{content:'◉';font-size:28px;color:#00e5ff;text-shadow:0 0 15px #00e5ff}
@keyframes reactor{0%,100%{box-shadow:0 0 20px #00e5ff}50%{box-shadow:0 0 40px #00e5ff}}@keyframes spin{to{transform:rotate(360deg)}}
.log{font-size:8px;background:rgba(0,0,0,0.7);padding:6px;border-radius:5px;max-height:65px;overflow-y:auto;border:1px solid rgba(0,229,255,0.2)}
</style>
</head>
<body>
<canvas id="canvas"></canvas><video id="video" autoplay playsinline muted></video>
<div id="ui">
<div id="jarvisHud"></div>
<h1 style="margin:0;text-align:center;letter-spacing:4px;font-family:'Orbitron';font-size:20px;text-shadow:0 0 15px #00e5ff">JARVIS-MARK53</h1>
<p style="font-size:8px;text-align:center;opacity:0.7;letter-spacing:2px">LIV INTEGRATED • ULTRA DETAILED • CENTERED</p>
<input id="cmd" placeholder='open youtube / call Mom / message Rahul / show heart'>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button onclick="startVoice()">🎤 VOICE</button><button onclick="toggleWake()">👂 WAKE OFF</button></div>
<div id="status" style="font-size:9px;margin-top:8px;padding:7px;background:rgba(0,229,255,0.15);border-radius:6px;border-left:3px solid #00e5ff">● ONLINE - Jarvis-Mark53 - HUD ACTIVE</div>
<div id="toolLog" class="log">LIV LOG: Ready</div>
<div style="margin-top:10px"><b style="font-size:10px">📱 OPEN ANY APP (LIV):</b><div class="app-grid">
<button class="app-btn" onclick="LIV.open_app('youtube')">YouTube</button>
<button class="app-btn" onclick="LIV.open_app('whatsapp')">WhatsApp</button>
<button class="app-btn" onclick="LIV.open_app('instagram')">Insta</button>
<button class="app-btn" onclick="LIV.open_app('gmail')">Gmail</button>
<button class="app-btn" onclick="LIV.open_app('maps')">Maps</button>
<button class="app-btn" onclick="LIV.open_app('camera')">Camera</button>
<button class="app-btn" onclick="LIV.open_app('spotify')">Spotify</button>
<button class="app-btn" onclick="LIV.open_app('chrome')">Chrome</button>
</div><input id="customApp" placeholder="Any app: netflix, facebook..."><button onclick="LIV.open_app(document.getElementById('customApp').value)">OPEN ANY APP</button></div>
<div style="margin-top:10px;border:1px solid #00ff88;padding:8px;border-radius:8px"><b style="font-size:10px;color:#00ff88">👥 MSG/CALL BY NAME + UNSAVED:</b>
<input id="contactName" placeholder="Name: Mom OR Number: 9876543210"><input id="msgText" placeholder="Message"><div class="app-grid">
<button class="app-btn" onclick="LIV.pick_contact()" style="background:rgba(0,229,255,0.25)!important">👥 Pick Contact</button>
<button class="app-btn" onclick="LIV.send_message('whatsapp')">💬 WhatsApp</button>
<button class="app-btn" onclick="LIV.send_message('call')">📞 Call</button>
<button class="app-btn" onclick="LIV.send_message('sms')">📩 SMS</button>
</div></div>
<div style="margin-top:10px"><b style="font-size:10px">🧬 ULTRA DETAILED:</b><div id="list" style="max-height:16vh;overflow-y:auto;border:1px solid rgba(0,229,255,0.2);padding:5px;border-radius:6px"></div></div>
<div style="margin-top:8px"><b style="font-size:10px">⚡ LIV TOOLS:</b><div class="app-grid">
<button class="app-btn" onclick="LIV.web_search()">🔍 Search</button>
<button class="app-btn" onclick="LIV.youtube()">▶ YT</button>
<button class="app-btn" onclick="LIV.weather()">🌤 Weather</button>
<button class="app-btn" onclick="LIV.reminder()">⏰ Reminder</button>
</div></div>
</div>
<div id="gesture"><b style="font-size:11px">LIV VISION</b><div style="font-size:9px;line-height:1.8;margin-top:6px">
<span id="gStatus">Hand: Init</span><br><span id="sysStatus">System: Online</span><br><span id="memStatus">Memory: New</span></div>
<div id="currentHolo" style="margin-top:8px;font-size:10px;padding:8px;background:rgba(0,229,255,0.12);border-radius:6px;border-left:3px solid #00e5ff">Current: HEART - Centered</div></div>
<script>
const LIV={APP_MAP:{youtube:{web:"https://youtube.com",app:"vnd.youtube://"},whatsapp:{web:"https://web.whatsapp.com",app:"whatsapp://send"},instagram:{web:"https://instagram.com",app:"instagram://"},gmail:{web:"https://mail.google.com",app:"googlegmail://"},maps:{web:"https://google.com/maps",app:"geo:0,0?q="},spotify:{web:"https://open.spotify.com",app:"spotify://"},netflix:{web:"https://netflix.com",app:"nflx://"},facebook:{web:"https://facebook.com",app:"fb://"},twitter:{web:"https://twitter.com",app:"twitter://"},telegram:{web:"https://web.telegram.org",app:"tg://"},camera:{app:"intent://#Intent;action=android.media.action.IMAGE_CAPTURE;end"},settings:{app:"intent://#Intent;action=android.settings.SETTINGS;end"},chrome:{web:"https://google.com",app:"googlechrome://"}},log(t,p){document.getElementById('toolLog').innerHTML=`> ${t} ${JSON.stringify(p).slice(0,50)}<br>`+document.getElementById('toolLog').innerHTML;},open_app(n){if(!n)return;n=n.toLowerCase().trim();this.log('open_app',{app:n});document.getElementById('status').innerHTML=`● Opening <b>${n.toUpperCase()}</b>`;let e=this.APP_MAP[n];if(e){try{window.location.href=e.app;}catch{}setTimeout(()=>{if(e.web)window.open(e.web,'_blank');},600);}else window.open(`https://www.google.com/search?q=${encodeURIComponent(n)}`,'_blank');},async pick_contact(){this.log('pick_contact',{});try{if(!(navigator.contacts&&navigator.contacts.select)){document.getElementById('status').innerText='Type number - unsaved works';return null;}const c=await navigator.contacts.select(['name','tel'],{multiple:false});if(c[0]){document.getElementById('contactName').value=c[0].tel[0].replace(/\D/g,'');document.getElementById('status').innerHTML=`● Picked: <b>${c[0].name[0]}</b>`;return c[0];}}catch{document.getElementById('status').innerText='Cancelled - type number';}return null;},send_message(type){let input=document.getElementById('contactName').value.trim();let msg=document.getElementById('msgText').value||'Hi from Jarvis-Mark53';let num=input.replace(/\D/g,'');if(!num||input.length<7&&isNaN(input)){document.getElementById('status').innerText=`Resolving "${input}"...`;this.pick_contact().then(c=>{if(c)setTimeout(()=>this.send_message(type),600);});return;}let finalNum=num.length===10?'91'+num:num;this.log('send_message',{type,number:finalNum});if(type==='whatsapp')window.open(`https://wa.me/${finalNum}?text=${encodeURIComponent(msg)}`,'_blank');else if(type==='sms')window.location.href=`sms:${num}?body=${encodeURIComponent(msg)}`;else{window.location.href=`tel:${num}`;}},web_search(){let q=document.getElementById('cmd').value||prompt('Search?');if(!q)return;this.log('web_search',{q});window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`,'_blank');},youtube(){let q=document.getElementById('cmd').value||'jarvis';this.log('youtube',{q});window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`,'_blank');},weather(){this.log('weather',{});window.open('https://www.google.com/search?q=weather','_blank');},reminder(){let t=prompt('Reminder?');if(!t)return;this.log('reminder',{t});setTimeout(()=>{try{new Notification('Jarvis-Mark53',{body:t});}catch{}document.getElementById('status').innerText='⏰ '+t;},4000);alert('Reminder in 4 sec: '+t);}};
const HOLOGRAMS=[{id:'heart',name:'Heart - 4 Chambers'},{id:'brain',name:'Brain - Gyri'},{id:'dna',name:'DNA - Base Pairs'},{id:'atom',name:'Atom - Orbitals'},{id:'blackhole',name:'Black Hole'},{id:'cube',name:'Cube'},{id:'sphere',name:'Sphere'},{id:'lungs',name:'Lungs'}];
let scene,camera,renderer,currentMesh,controls={rotX:0,rotY:0,scale:1.25},heartbeat=0;
function initThree(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,1000);camera.position.set(0,0.1,3.0);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);scene.add(new THREE.AmbientLight(0x666666,0.8));let l1=new THREE.PointLight(0x00e5ff,2.5,15);l1.position.set(3,3,4);scene.add(l1);let l2=new THREE.PointLight(0xff0055,1.2,10);l2.position.set(-3,-2,2);scene.add(l2);animate();}
function createHologram(id){if(currentMesh)scene.remove(currentMesh);let group=new THREE.Group();group.position.set(0,0,0);let mesh=null;if(id==='heart'){let s=new THREE.Shape();s.moveTo(0,0.7);s.bezierCurveTo(0.8,1.3,1.4,0.3,0.2,-1.1);s.bezierCurveTo(0,-0.9,-0.2,-0.9,0.2,-1.1);s.bezierCurveTo(-1.4,0.3,-0.8,1.3,0,0.7);let geo=new THREE.ExtrudeGeometry(s,{depth:0.55,bevelEnabled:true,bevelThickness:0.08});mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0xcc0022,emissive:0x440011,shininess:120}));mesh.scale.set(0.65,0.65,0.65);let aorta=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.13,0.7,16),new THREE.MeshPhongMaterial({color:0xaa0000}));aorta.position.set(0.15,0.75,0.15);aorta.rotation.z=-0.2;group.add(aorta);for(let i=0;i<6;i++){let v=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.4,6),new THREE.MeshBasicMaterial({color:0x550011}));v.position.set(Math.sin(i)*0.15,-0.2+i*0.08,0.28);v.rotation.x=1.2;group.add(v);}}else if(id==='brain'){let geo=new THREE.SphereGeometry(0.82,80,80);let pos=geo.attributes.position;for(let i=0;i<pos.count;i++){let x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);let gyri=Math.sin(x*14)*0.07+Math.cos(y*13)*0.07;let len=Math.sqrt(x*x+y*y+z*z);if(len>0){let f=0.82+gyri;pos.setXYZ(i,x/len*f,y/len*f,z/len*f);}}pos.needsUpdate=true;geo.computeVertexNormals();mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0xffc8a0}));}else if(id==='dna'){for(let i=0;i<50;i++){let y=(i-25)*0.085,ang=i*0.38;let s1=new THREE.Mesh(new THREE.SphereGeometry(0.048,10,10),new THREE.MeshPhongMaterial({color:0x00e5ff}));s1.position.set(Math.sin(ang)*0.45,y,Math.cos(ang)*0.45);group.add(s1);let s2=s1.clone();s2.material=new THREE.MeshPhongMaterial({color:0xffbb00});s2.position.set(Math.sin(ang+Math.PI)*0.45,y,Math.cos(ang+Math.PI)*0.45);group.add(s2);}}else if(id==='atom'){group.add(new THREE.Mesh(new THREE.SphereGeometry(0.16,24,24),new THREE.MeshPhongMaterial({color:0xff1111,emissive:0x880000})));[0.62,0.92,1.22].forEach(r=>{let t=new THREE.Mesh(new THREE.TorusGeometry(r,0.01,8,140),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.75}));t.rotation.x=Math.random()*Math.PI;group.add(t);});}else if(id==='blackhole'){let disk=new THREE.Mesh(new THREE.RingGeometry(0.6,1.45,80),new THREE.MeshBasicMaterial({color:0xff7700,side:THREE.DoubleSide,transparent:true,opacity:0.9}));disk.rotation.x=Math.PI/2;group.add(disk);group.add(new THREE.Mesh(new THREE.SphereGeometry(0.48,32,32),new THREE.MeshBasicMaterial({color:0x000000})));}else{let geo=id==='cube'?new THREE.BoxGeometry(0.85,0.85,0.85):new THREE.SphereGeometry(0.7,64,64);mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0x00e5ff,emissive:0x001122,transparent:true,opacity:0.94}));}if(mesh)group.add(mesh);group.position.set(0,0,0);currentMesh=group;scene.add(currentMesh);document.getElementById('currentHolo').innerHTML=`Current: <b>${id.toUpperCase()}</b> - Centered`;}
function animate(){requestAnimationFrame(animate);heartbeat+=0.08;if(currentMesh){let isHeart=document.getElementById('currentHolo').innerText.includes('HEART');let beat=isHeart?1+Math.sin(heartbeat)*0.06:1;currentMesh.rotation.y+=0.006+controls.rotY*0.025;currentMesh.rotation.x+=controls.rotX*0.012;currentMesh.position.set(0,0,0);currentMesh.scale.setScalar(controls.scale*beat);}renderer.render(scene,camera);}
function startVoice(){let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec)return;let rec=new Rec();rec.lang='en-IN';rec.start();document.getElementById('status').innerText='🎤 Listening...';rec.onresult=e=>{let cmd=e.results[0][0].transcript.toLowerCase();document.getElementById('cmd').value=cmd;handleCommand(cmd);};}let wakeOn=false,wakeRec=null;function toggleWake(){wakeOn=!wakeOn;event.target.innerText=wakeOn?'👂 WAKE ON':'👂 WAKE OFF';if(wakeOn){let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;wakeRec=new Rec();wakeRec.continuous=true;wakeRec.lang='en-IN';wakeRec.start();wakeRec.onresult=e=>{let t=e.results[e.results.length-1][0].transcript.toLowerCase();if(t.includes('jarvis')){document.getElementById('status').innerText='🔥 WAKE: '+t;handleCommand(t.replace(/hey jarvis|jarvis/g,'').trim());}};}else wakeRec?.stop();}
function handleCommand(cmd){document.getElementById('status').innerHTML=`● Heard: <b>${cmd}</b>`;if(cmd.includes('open')){let app=cmd.replace('open','').trim().split(' ')[0];LIV.open_app(app);}else if(cmd.includes('call')){let name=cmd.replace('call','').trim();document.getElementById('contactName').value=name;LIV.send_message('call');}else if(cmd.includes('message')||cmd.includes('whatsapp')){let name=cmd.replace(/message|whatsapp/g,'').trim();document.getElementById('contactName').value=name;LIV.send_message('whatsapp');}else if(cmd.includes('search'))LIV.web_search();else{let f=HOLOGRAMS.find(h=>cmd.includes(h.id));if(f)createHologram(f.id);}}
document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')handleCommand(e.target.value.toLowerCase());});
function renderList(){let d=document.getElementById('list');d.innerHTML='';HOLOGRAMS.forEach(h=>{let b=document.createElement('div');b.className='holo-btn';b.innerText=h.name;b.onclick=()=>createHologram(h.id);d.appendChild(b);});}
window.onload=()=>{initThree();renderList();createHologram('heart');let video=document.getElementById('video');let hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.65,minTrackingConfidence:0.65});hands.onResults(r=>{if(!r.multiHandLandmarks||r.multiHandLandmarks.length===0)return;let h=r.multiHandLandmarks[0];let pinch=Math.hypot(h[4].x-h[8].x,h[4].y-h[8].y);if(pinch<0.06)controls.scale=Math.max(0.4,Math.min(3,controls.scale+(0.06-pinch)*3));controls.rotY=(h[0].x-0.5)*2.5;controls.rotX=(h[0].y-0.5)*2;document.getElementById('gStatus').innerText='Hand: TRACKING';});let cam=new Camera(video,{onFrame:async()=>{await hands.send({image:video});},width:320,height:240});cam.start().catch(()=>document.getElementById('gStatus').innerText='Allow Camera');};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
